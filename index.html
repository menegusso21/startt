<!DOCTYPE html>
<html lang="pt-brasil">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Flashcard de Mitos e Verdades</title>
  <style>
    header {
      background-color: #183C63;
      color: #ffffff;
      text-align: center;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid #69c7f3;
    }

    main {
      background-color: #ffffff;
      color: #183C63;
      text-align: center;
      margin: 0 auto;
      padding: 16px;
      display: flex;

    }

    img {
      width: 80px;
      height: 80px;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Meu Blog Tech</h1>
    <p>Vou compartilhar conhecimentos sobre tecnologia</p>
  </header>
  <main>
    <img src="imagemdoblog.png" alt="imagem do blog">

    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: Tania Menegusso</p>
      <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.
      </p>
      <button>❤️​ <span>0</span></button>
      <button>​​👍​<span>0</span></button>
    </div>
  </main>

</body>
<script>
  const botoes = document.querySelectorAll("button");

  botoes.forEach(function (botao) {
    botao.addEventListener("click", botaoClicado);

    function botaoClicado() {
      console.log("fui clicado");
      let texto = botao.querySelector("span");
      texto.textContent++;
    }
  });
</script>

</html>
